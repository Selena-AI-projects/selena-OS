# License Compliance Check
#
# Validates that all dependencies use licenses compatible with MIT.
# Manual-only: run this from the Actions UI when dependency license validation is needed.
# Lightweight – only needs Node + pnpm, no Docker or databases.

name: License Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    name: Dependency License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Check dependency licenses
        run: pnpm license-check
